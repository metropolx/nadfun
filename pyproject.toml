[project]
name = "nadfun-export"
version = "0.1.0"
description = "Exports the nad.fun launch dataset as CSV and JSON from a consistent database snapshot."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
nadfun-export = "nadfun_export.__main__:main"

[dependency-groups]
dev = [
    "frictionless[json]>=5.18",
    "jsonschema>=4.23",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nadfun_export"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
